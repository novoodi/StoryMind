name: Test

on:
  push:
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # AGP needs the Android SDK platform/build-tools present to configure the :app and
      # :core(androidTarget) modules, even though this job never launches an emulator.
      - uses: android-actions/setup-android@v3

      # Caches the Gradle wrapper, dependencies, and build outputs across runs.
      - uses: gradle/actions/setup-gradle@v4

      # :core:jvmTest (ai/ domain logic) + :app's JVM unit tests. connectedAndroidTest is
      # deliberately not run here — it needs a device/emulator with the on-device Gemma model
      # file pushed to it (see CLAUDE.md), which this runner doesn't have.
      - name: Run unit tests
        run: ./gradlew test --console=plain
