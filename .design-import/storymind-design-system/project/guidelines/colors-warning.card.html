<!-- @dsCard group="Colors" viewport="700x150" name="Warning & Status" subtitle="Pastel warning · success · amber — never aggressive red" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px 22px; background:#fff; display:flex; gap:10px; height:150px; box-sizing:border-box; overflow:hidden; font-family:var(--font-sans,sans-serif); align-items:center; }
  .group { flex:1; display:flex; flex-direction:column; gap:5px; }
  .label { font-size:10px; font-weight:700; color:var(--neutral-400,#9EA3B3); letter-spacing:.02em; text-transform:uppercase; margin-bottom:4px; }
  .row { display:flex; gap:4px; }
  .sw { flex:1; height:36px; border-radius:6px; display:flex; align-items:center; justify-content:center; font:10px/1 monospace; }
  .divider { width:1px; background:var(--neutral-100,#F2F4F9); }
</style>
</head>
<body>
<div class="group">
  <div class="label">Warning / Error</div>
  <div class="row">
    <div class="sw" style="background:var(--red-50);color:var(--neutral-400)">#FFF0F0</div>
    <div class="sw" style="background:var(--red-100);color:var(--neutral-500)">#FFD6D6</div>
    <div class="sw" style="background:var(--red-400);color:#fff">#F87171</div>
    <div class="sw" style="background:var(--red-500);color:#fff">#EF4444</div>
  </div>
</div>
<div class="divider"></div>
<div class="group">
  <div class="label">Success</div>
  <div class="row">
    <div class="sw" style="background:var(--green-50);color:var(--neutral-400)">#F0FFF4</div>
    <div class="sw" style="background:var(--green-100);color:var(--neutral-500)">#DCFCE7</div>
    <div class="sw" style="background:var(--green-500);color:#fff">#22C55E</div>
    <div class="sw" style="background:var(--green-600);color:#fff">#16A34A</div>
  </div>
</div>
<div class="divider"></div>
<div class="group">
  <div class="label">Amber</div>
  <div class="row">
    <div class="sw" style="background:var(--amber-50);color:var(--neutral-400)">#FFFBEB</div>
    <div class="sw" style="background:var(--amber-100);color:var(--neutral-500)">#FEF3C7</div>
    <div class="sw" style="background:var(--amber-500);color:#fff">#F59E0B</div>
    <div class="sw" style="background:var(--amber-600);color:#fff">#D97706</div>
  </div>
</div>
</body>
</html>
