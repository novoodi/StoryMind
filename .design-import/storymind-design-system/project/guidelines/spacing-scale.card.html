<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base grid · --space-1 (4px) → --space-16 (64px)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 24px; background:#fff; height:170px; box-sizing:border-box; overflow:hidden; font-family:var(--font-sans,sans-serif); display:flex; flex-direction:column; gap:14px; justify-content:center; }
  .scale { display:flex; align-items:center; gap:6px; }
  .block { background:var(--color-brand,#1F4EF5); border-radius:3px; height:20px; opacity:.85; flex-shrink:0; }
  .labels { display:flex; gap:6px; }
  .lbl { font-size:9px; color:var(--neutral-400,#9EA3B3); font-family:monospace; text-align:center; flex-shrink:0; }
</style>
</head>
<body>
  <div class="scale">
    <div class="block" style="width:4px" title="4px"></div>
    <div class="block" style="width:8px"></div>
    <div class="block" style="width:12px"></div>
    <div class="block" style="width:16px"></div>
    <div class="block" style="width:20px"></div>
    <div class="block" style="width:24px"></div>
    <div class="block" style="width:32px"></div>
    <div class="block" style="width:40px"></div>
    <div class="block" style="width:48px"></div>
    <div class="block" style="width:64px"></div>
  </div>
  <div class="labels">
    <span class="lbl" style="width:4px">1</span>
    <span class="lbl" style="width:8px">2</span>
    <span class="lbl" style="width:12px">3</span>
    <span class="lbl" style="width:16px">4</span>
    <span class="lbl" style="width:20px">5</span>
    <span class="lbl" style="width:24px">6</span>
    <span class="lbl" style="width:32px">8</span>
    <span class="lbl" style="width:40px">10</span>
    <span class="lbl" style="width:48px">12</span>
    <span class="lbl" style="width:64px">16</span>
  </div>
  <div style="font-size:10px;color:var(--neutral-300);font-family:monospace">4px · 8px · 12px · 16px · 20px · 24px · 32px · 40px · 48px · 64px</div>
</body>
</html>
