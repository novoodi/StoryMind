<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>

  .label { font-size:10px; font-weight:600; color:var(--neutral-300,#C8CBDA); letter-spacing:.04em; text-transform:uppercase; margin-bottom:10px; font-family:monospace; }

  .meta { font-size:11px; color:var(--neutral-400,#9EA3B3); margin-top:8px; font-family:monospace; }
</style>
</head>
<body>
  <div class="label">--text-lg · Body / Editor</div>
  <p class="body">빗소리가 창문을 두드렸다. 김지우는 커피잔을 두 손으로 감싸 쥐며 창밖을 바라보았다.</p>
  <div class="meta">18px · weight 400 · line-height 1.8 · letter-spacing -0.01em</div>

</html>
