<!-- @dsCard group="Colors" viewport="700x150" name="Brand Blue" subtitle="Primary brand color scale · #1F4EF5" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px 22px; background:#fff; display:flex; align-items:flex-end; gap:5px; height:150px; box-sizing:border-box; overflow:hidden; }
  .s { flex:1; display:flex; flex-direction:column; gap:5px; }
  .sw { border-radius:7px; height:60px; position:relative; }
  .n { font:600 9px/1 var(--font-sans,sans-serif); color:var(--neutral-400,#9EA3B3); text-align:center; }
  .v { font:9px/1 monospace; color:var(--neutral-300,#C8CBDA); text-align:center; margin-top:2px; }
  .lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 10px/1 var(--font-sans,sans-serif); color:#fff; letter-spacing:-.01em; }
</style>
</head>
<body>
<div class="s"><div class="sw" style="background:var(--blue-50)"></div><div class="n">50</div><div class="v">#EBF0FF</div></div>
<div class="s"><div class="sw" style="background:var(--blue-100)"></div><div class="n">100</div><div class="v">#D6E2FF</div></div>
<div class="s"><div class="sw" style="background:var(--blue-200)"></div><div class="n">200</div><div class="v">#ADCDFF</div></div>
<div class="s"><div class="sw" style="background:var(--blue-300)"></div><div class="n">300</div><div class="v">#85ACFF</div></div>
<div class="s"><div class="sw" style="background:var(--blue-400)"></div><div class="n">400</div><div class="v">#4D79F8</div></div>
<div class="s" style="flex:1.6"><div class="sw" style="background:var(--blue-500)"><div class="lbl">Brand</div></div><div class="n">500</div><div class="v">#1F4EF5</div></div>
<div class="s"><div class="sw" style="background:var(--blue-600)"></div><div class="n">600</div><div class="v">#1940D4</div></div>
<div class="s"><div class="sw" style="background:var(--blue-700)"></div><div class="n">700</div><div class="v">#1533A8</div></div>
<div class="s"><div class="sw" style="background:var(--blue-800)"></div><div class="n">800</div><div class="v">#0F2580</div></div>
</body>
</html>
