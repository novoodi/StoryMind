<!-- @dsCard group="Colors" viewport="700x150" name="Neutral" subtitle="Blue-tinted gray scale · #1A1B1E primary text, never pure black" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px 22px; background:#fff; display:flex; align-items:flex-end; gap:4px; height:150px; box-sizing:border-box; overflow:hidden; }
  .s { flex:1; display:flex; flex-direction:column; gap:5px; }
  .sw { border-radius:6px; height:60px; position:relative; }
  .n { font:600 8.5px/1 var(--font-sans,sans-serif); color:var(--neutral-400,#9EA3B3); text-align:center; }
  .v { font:8px/1 monospace; color:var(--neutral-300,#C8CBDA); text-align:center; margin-top:2px; }
  .lbl { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font:700 9px/1 var(--font-sans,sans-serif); color:#fff; letter-spacing:-.01em; }
</style>
</head>
<body>
<div class="s"><div class="sw" style="background:var(--neutral-50)"></div><div class="n">50</div><div class="v">#F8F9FC</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-100)"></div><div class="n">100</div><div class="v">#F2F4F9</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-200)"></div><div class="n">200</div><div class="v">#E5E7EF</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-300)"></div><div class="n">300</div><div class="v">#C8CBDA</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-400)"></div><div class="n">400</div><div class="v">#9EA3B3</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-500)"></div><div class="n">500</div><div class="v">#6B7089</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-600)"></div><div class="n">600</div><div class="v">#5C5F6B</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-700)"></div><div class="n">700</div><div class="v">#3D404D</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-800)"></div><div class="n">800</div><div class="v">#2D2F36</div></div>
<div class="s"><div class="sw" style="background:var(--neutral-900)"></div><div class="n">900</div><div class="v">#22242C</div></div>
<div class="s" style="flex:1.5"><div class="sw" style="background:var(--neutral-950)"><div class="lbl">Text</div></div><div class="n">950</div><div class="v">#1A1B1E</div></div>
</body>
</html>
