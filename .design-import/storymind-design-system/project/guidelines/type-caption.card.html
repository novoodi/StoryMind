<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:18px 24px; background:#fff; height:160px; box-sizing:border-box; overflow:hidden; font-family:var(--font-sans,sans-serif); display:flex; flex-direction:column; gap:0; justify-content:center; }
  .row { display:flex; align-items:center; gap:16px; padding:7px 0; border-bottom:1px solid var(--neutral-100,#F2F4F9); }
  .row:last-child { border-bottom:none; }
  .meta { font-size:9px; font-weight:600; color:var(--neutral-300,#C8CBDA); font-family:monospace; width:100px; flex-shrink:0; }
  .tag { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-weight:600; letter-spacing:-.01em; }
</style>
</head>
<body>
  <div class="row">
    <span class="meta">11px · xs</span>
    <span style="font-size:11px;color:var(--text-tertiary)">이야기의 앞뒤를 맞추고 있어요 · 방금 전 · 3분 전</span>
  </div>
  <div class="row">
    <span class="meta">12px · sm</span>
    <span style="font-size:12px;color:var(--text-secondary)">살펴보는 중이에요 — 설정집을 정리하고 있어요 ·</span>
    <span class="tag" style="font-size:11px;background:var(--blue-50);color:var(--color-brand)">분석 중</span>
  </div>
  <div class="row">
    <span class="meta">14px · base</span>
    <span style="font-size:14px;font-weight:500;color:var(--text-primary)">에디터 · 세컨드 브레인 · 위키 · 설정</span>
  </div>
  <div class="row">
    <span class="meta">15px · md–</span>
    <span style="font-size:15px;font-weight:600;color:var(--text-primary)">카드 제목 · 챕터 이름 · 인물 이름</span>
  </div>
</body>
</html>
