<!-- @dsCard group="Effects" viewport="700x150" name="Shadows" subtitle="xs → float · blue-tinted base color rgba(26,27,30,…)" -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin:0; padding:20px 28px; background:var(--neutral-50,#F8F9FC); display:flex; align-items:center; justify-content:space-between; gap:14px; height:150px; box-sizing:border-box; overflow:hidden; font-family:var(--font-sans,sans-serif); }
  .card { flex:1; height:72px; background:#fff; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; }
  .lbl { font-size:9.5px; font-weight:600; color:var(--neutral-400,#9EA3B3); }
</style>
</head>
<body>
  <div class="card" style="box-shadow:var(--shadow-xs)"><span class="lbl">xs</span></div>
  <div class="card" style="box-shadow:var(--shadow-sm)"><span class="lbl">sm</span></div>
  <div class="card" style="box-shadow:var(--shadow-card)"><span class="lbl">card</span></div>
  <div class="card" style="box-shadow:var(--shadow-md)"><span class="lbl">md</span></div>
  <div class="card" style="box-shadow:var(--shadow-lg)"><span class="lbl">lg</span></div>
  <div class="card" style="box-shadow:var(--shadow-float)"><span class="lbl">float</span></div>
</body>
</html>
