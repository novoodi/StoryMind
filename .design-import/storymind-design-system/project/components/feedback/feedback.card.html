<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script src="../../_ds_bundle.js"></script>
<style>
  body { margin:0; padding:18px 24px; background:var(--neutral-50,#F8F9FC); height:200px; box-sizing:border-box; overflow:hidden; }
  @keyframes sm-pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { StatusBadge } = window.StoryMindDesignSystem_7de6de;
function Demo() {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
        <StatusBadge status="analyzing"/>
        <StatusBadge status="syncing"/>
        <StatusBadge status="warning"/>
        <StatusBadge status="done"/>
        <span style={{fontSize:11,color:'var(--neutral-400)',fontFamily:'var(--font-sans)'}}>idle → null</span>
      </div>
      <div style={{background:'#fff',borderRadius:14,padding:'14px 16px',boxShadow:'0 1px 4px rgba(26,27,30,.06)'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:'var(--red-500)',animation:'sm-pulse 1.5s ease-in-out infinite'}}/>
          <span style={{fontFamily:'var(--font-sans)',fontSize:13,fontWeight:700,color:'var(--red-500)'}}>잠깐만요!</span>
        </div>
        <p style={{fontFamily:'var(--font-sans)',fontSize:13,color:'var(--text-secondary)',margin:'0 0 12px',lineHeight:1.6}}>
          박민준이 2장에서 이미 자리를 떠났는데, 여기서 다시 등장하고 있어요.
        </p>
        <div style={{display:'flex',gap:8}}>
          <button style={{flex:1,height:44,background:'var(--color-brand)',color:'#fff',border:'none',borderRadius:12,fontFamily:'var(--font-sans)',fontSize:14,fontWeight:600,cursor:'pointer'}}>설정 확인하기</button>
          <button style={{flex:1,height:44,background:'var(--neutral-100)',color:'var(--text-secondary)',border:'none',borderRadius:12,fontFamily:'var(--font-sans)',fontSize:14,fontWeight:500,cursor:'pointer'}}>그냥 둘래요</button>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>

</html>
