const BrainScreen = () => {
  const T = useT();
  const canvasRef = useRef(null);
  const dragRef   = useRef(null);
  const ttTimer   = useRef(null);

  const [positions, setPositions] = useState(() =>
    Object.fromEntries(NODES.map(n => [n.id, {x:n.x, y:n.y}]))
  );
  const [hovered,    setHovered]    = useState(null);
  const [pressed,    setPressed]    = useState(null);
  const [selected,   setSelected]   = useState(null);
  const [tooltipId,  setTooltipId]  = useState(null);
  const [tooltipVis, setTooltipVis] = useState(false);
  const [filter,     setFilter]     = useState('전체');

  /* tooltip fade-in / fade-out lifecycle */
  useEffect(() => {
    clearTimeout(ttTimer.current);
    if (selected) {
      setTooltipId(selected); setTooltipVis(false);
      ttTimer.current = setTimeout(() => setTooltipVis(true), 20);
    } else {
      setTooltipVis(false);
      ttTimer.current = setTimeout(() => setTooltipId(null), 160);
    }
    return () => clearTimeout(ttTimer.current);
  }, [selected]);

  /* which node is focused (hover wins over tap) */
  const focusId = hovered || selected;
  const connectedSet = focusId
    ? new Set([focusId, ...EDGES.flatMap(([a,b]) => a===focusId?[b]:b===focusId?[a]:[])])
    : null;

  const NODE_C = {
    character:{fill:T.brand,  bg:T.brandSubtle},
    place:    {fill:T.green,  bg:T.greenBg},
    item:     {fill:T.amber,  bg:T.amberBg},
    event:    {fill:T.purple, bg:T.purpleBg},
    orphan:   {fill:T.red,    bg:T.redBg},
  };

  /* ── Drag handlers ── */
  const handlePointerDown = (e, id) => {
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    const rect = canvasRef.current.getBoundingClientRect();
    const pos  = positions[id];
    dragRef.current = {id, startCX:e.clientX, startCY:e.clientY,
      startX:pos.x, startY:pos.y, cW:rect.width, cH:rect.height, moved:false};
    setPressed(id);
  };
  const handlePointerMove = (e) => {
    if (!dragRef.current) return;
    const {id,startCX,startCY,startX,startY,cW,cH} = dragRef.current;
    const dx = e.clientX - startCX, dy = e.clientY - startCY;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragRef.current.moved = true;
    setPositions(p => ({...p, [id]:{
      x: Math.max(5, Math.min(95, startX + dx/cW*100)),
      y: Math.max(5, Math.min(95, startY + dy/cH*100)),
    }}));
  };
  const handlePointerUp = (e, id) => {
    const dr = dragRef.current;
    dragRef.current = null;
    setPressed(null);
    if (dr && !dr.moved) setSelected(prev => prev===id ? null : id);
  };

  /* tooltip wiki data — fallback for orphan nodes */
  const wikiEntry = tooltipId
    ? (WIKI.find(w => w.id===tooltipId) || {
        id: tooltipId, type:'orphan',
        name: NODES.find(n => n.id===tooltipId)?.label || tooltipId,
        desc: '아직 연결되지 않은 이야기예요.',
        chapter: '—'
      })
    : null;

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:T.bgSubtle,overflow:'hidden',transition:'background .4s'}}>
      <Toolbar title="세컨드 브레인"/>

      {/* Filter pills */}
      <div style={{display:'flex',gap:6,padding:'9px 15px',borderBottom:`1px solid ${T.border}`,background:T.bg,flexShrink:0,overflowX:'auto',transition:'background .4s,border-color .4s'}}>
        {['전체','인물','장소','소품','사건'].map(f => (
          <div key={f} onClick={()=>setFilter(f)} style={{padding:'5px 13px',borderRadius:999,fontSize:12,fontWeight:f===filter?700:500,fontFamily:T.font,background:f===filter?T.brand:'transparent',color:f===filter?'#fff':T.textSec,cursor:'pointer',letterSpacing:'-.01em',border:f===filter?'none':`1px solid ${T.border}`,flexShrink:0,transition:'background .3s,color .3s,border-color .3s'}}>
            {f}
          </div>
        ))}
      </div>

      {/* Graph canvas */}
      <div
        ref={canvasRef}
        onClick={e => { if (e.target===canvasRef.current) setSelected(null); }}
        style={{flex:1,position:'relative',overflow:'hidden'}}
      >
        {/* ── Edges SVG ── */}
        <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',pointerEvents:'none'}} viewBox="0 0 100 100" preserveAspectRatio="none">
          {EDGES.map(([a,b],i) => {
            const na=positions[a], nb=positions[b];
            const hilit = !focusId || a===focusId || b===focusId;
            return (
              <line key={i} x1={na.x} y1={na.y} x2={nb.x} y2={nb.y}
                stroke={hilit && focusId ? T.brand : T.edgeLine}
                strokeWidth={hilit && focusId ? '1' : '0.6'}
                style={{opacity:focusId?(hilit?1:0.12):1, transition:'opacity .25s,stroke .25s,stroke-width .25s'}}
              />
            );
          })}
        </svg>

        {/* ── Nodes ── */}
        {NODES.map(node => {
          const c      = NODE_C[node.type];
          const isSel  = selected === node.id;
          const isHov  = hovered  === node.id;
          const isPrs  = pressed  === node.id;
          const isDrg  = dragRef.current?.id === node.id;
          const hilit  = !focusId || connectedSet.has(node.id);
          /* Squash & Anticipation scale */
          const nodeScale = isPrs ? 0.95 : (isHov || isSel) ? 1.05 : 1;

          return (
            <div
              key={node.id}
              style={{
                position:'absolute',
                left:`${positions[node.id].x}%`,
                top:`${positions[node.id].y}%`,
                transform:'translate(-50%,-50%)',
                display:'flex', flexDirection:'column', alignItems:'center', gap:4,
                cursor: isPrs ? 'grabbing' : 'grab',
                zIndex: isSel||isPrs ? 10 : 2,
                /* Staging focus: unfocused nodes dim to 0.18 */
                opacity: focusId ? (hilit ? 1 : 0.18) : 1,
                transition: `opacity .22s${isDrg ? '' : ',left .06s ease-out,top .06s ease-out'}`,
                touchAction:'none', userSelect:'none', WebkitTapHighlightColor:'transparent',
              }}
              onPointerDown={e => handlePointerDown(e, node.id)}
              onPointerMove={handlePointerMove}
              onPointerUp={e => handlePointerUp(e, node.id)}
              onPointerEnter={() => { if (!dragRef.current) setHovered(node.id); }}
              onPointerLeave={() => { if (!dragRef.current || dragRef.current.id!==node.id) setHovered(null); }}
            >
              <div style={{
                width:46, height:46, borderRadius:'50%',
                background: c.bg,
                border: `2.5px solid ${isSel ? c.fill : 'transparent'}`,
                display:'flex', alignItems:'center', justifyContent:'center',
                boxShadow: isSel
                  ? `0 0 0 5px ${T.brandSubtle}, 0 4px 16px rgba(26,27,30,.22)`
                  : '0 2px 6px rgba(26,27,30,.10)',
                /* spring-back release via cubic-bezier overshoot */
                transform: `scale(${nodeScale})`,
                transition: `transform ${isPrs ? '80ms ease-out' : isHov ? '100ms ease-out' : '300ms cubic-bezier(0.34,1.56,0.64,1)'}, border-color .15s, box-shadow .2s, background .4s`,
                /* orphan gentle breathing instead of harsh flash */
                animation: node.type==='orphan' ? 'sm-orphan-breathe 2.6s ease-in-out infinite' : 'none',
              }}>
                <div style={{width:14, height:14, borderRadius:'50%', background:c.fill, transition:'background .4s'}}/>
              </div>
              <span style={{
                fontFamily:T.font, fontSize:10, fontWeight: isSel ? 700 : 600,
                color: node.type==='orphan' ? T.red : (isSel ? c.fill : T.text),
                whiteSpace:'nowrap',
                textShadow:`0 0 8px ${T.bgSubtle},0 0 8px ${T.bgSubtle}`,
                transition:'color .2s',
              }}>{node.label}</span>
            </div>
          );
        })}

        {/* ── Tooltip card (150ms ease-out slide-up) ── */}
        {tooltipId && (
          <div style={{
            position:'absolute', bottom:60, left:14, right:14,
            background:T.bg, borderRadius:16, padding:'14px 16px',
            boxShadow:`0 6px 28px rgba(26,27,30,.22), 0 0 0 1px ${T.border}`,
            zIndex:30,
            opacity:    tooltipVis ? 1 : 0,
            transform:  tooltipVis ? 'translateY(0)' : 'translateY(10px)',
            transition: 'opacity 150ms ease-out, transform 150ms ease-out, background .4s',
            pointerEvents: tooltipVis ? 'auto' : 'none',
          }}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:7}}>
              <span style={{fontFamily:T.font,fontSize:15,fontWeight:700,color:T.text,letterSpacing:'-.02em',flex:1,transition:'color .4s'}}>
                {wikiEntry?.name}
              </span>
              {wikiEntry && <WikiChip type={wikiEntry.type}/>}
              <button onClick={()=>setSelected(null)} style={{width:28,height:28,display:'flex',alignItems:'center',justifyContent:'center',background:'none',border:'none',cursor:'pointer',color:T.textTert,borderRadius:6,flexShrink:0,padding:0}}>
                <IcClose/>
              </button>
            </div>
            {wikiEntry && (
              <>
                <p style={{fontFamily:T.font,fontSize:13,color:T.textSec,margin:'0 0 6px',lineHeight:1.55,letterSpacing:'-.01em',transition:'color .4s'}}>{wikiEntry.desc}</p>
                <span style={{fontFamily:T.font,fontSize:11,color:T.textTert,transition:'color .4s'}}>마지막 등장: {wikiEntry.chapter}</span>
              </>
            )}
          </div>
        )}

        {/* ── Orphan warning banner ── */}
        <div style={{position:'absolute',bottom:12,left:12,right:12}}>
          <div style={{background:T.redBg,borderRadius:12,padding:'9px 13px',display:'flex',alignItems:'center',gap:8,transition:'background .4s'}}>
            <div style={{width:6,height:6,borderRadius:'50%',background:T.red,animation:'sm-orphan-breathe 2.6s ease-in-out infinite',flexShrink:0}}/>
            <span style={{fontFamily:T.font,fontSize:12,color:T.red,letterSpacing:'-.01em'}}>아직 연결되지 않은 이야기예요 — 수상한 남자</span>
          </div>
        </div>
      </div>
    </div>
  );
};

const WikiScreen = () => {
  const T = useT();
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:T.bg,overflow:'hidden',transition:'background .4s'}}>
      <Toolbar title="위키" right={<IBtn><IcSearch/></IBtn>}/>
      <div style={{flex:1,overflowY:'auto',padding:'12px 15px',display:'flex',flexDirection:'column',gap:10}}>
        {WIKI.map(e => (
          <div key={e.id} style={{background:T.bg,borderRadius:14,padding:'13px 15px',boxShadow:`0 1px 4px rgba(26,27,30,.06),0 0 0 1px ${T.border}`,cursor:'pointer',transition:'background .4s,box-shadow .4s'}}>
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:5}}>
              <span style={{fontFamily:T.font,fontSize:15,fontWeight:700,color:T.text,letterSpacing:'-.01em',transition:'color .4s'}}>{e.name}</span>
              <WikiChip type={e.type}/>
            </div>
            <p style={{fontFamily:T.font,fontSize:13,color:T.textSec,margin:'0 0 5px',lineHeight:1.5,letterSpacing:'-.01em',transition:'color .4s'}}>{e.desc}</p>
            <span style={{fontFamily:T.font,fontSize:11,color:T.textTert,transition:'color .4s'}}>마지막 등장: {e.chapter}</span>
          </div>
        ))}
      </div>
    </div>
  );
};

const SettingsScreen = () => {
  const T = useT();
  const [toggles, setToggles] = useState({spell:true,auto:true,conflict:true,wiki:false});
  const tog = k => setToggles(p => ({...p,[k]:!p[k]}));
  const Toggle = ({on, onClick}) => (
    <div onClick={onClick} style={{width:44,height:26,borderRadius:13,background:on?T.brand:'#C8CBDA',padding:3,display:'flex',alignItems:'center',justifyContent:on?'flex-end':'flex-start',cursor:'pointer',transition:'background .2s',flexShrink:0}}>
      <div style={{width:20,height:20,borderRadius:'50%',background:'#fff',boxShadow:'0 1px 3px rgba(0,0,0,.18)'}}/>
    </div>
  );
  const Row = ({label, value, toggleKey}) => (
    <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'14px 0',borderBottom:`1px solid ${T.border}`,transition:'border-color .4s'}}>
      <span style={{fontFamily:T.font,fontSize:16,color:T.text,letterSpacing:'-.01em',transition:'color .4s'}}>{label}</span>
      {toggleKey
        ? <Toggle on={toggles[toggleKey]} onClick={()=>tog(toggleKey)}/>
        : <span style={{fontFamily:T.font,fontSize:14,color:T.textTert,transition:'color .4s'}}>{value}</span>}
    </div>
  );
  const Section = ({title}) => (
    <div style={{fontFamily:T.font,fontSize:12,fontWeight:700,color:T.textTert,letterSpacing:'.04em',textTransform:'uppercase',padding:'20px 0 8px',transition:'color .4s'}}>{title}</div>
  );
  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',background:T.bg,overflow:'hidden',transition:'background .4s'}}>
      <Toolbar title="설정"/>
      <div style={{flex:1,overflowY:'auto',padding:'0 22px'}}>
        <Section title="에디터"/>
        <Row label="글꼴 크기" value="18px"/>
        <Row label="줄 간격" value="1.8"/>
        <Row label="맞춤법 검사" toggleKey="spell"/>
        <Section title="AI 기능"/>
        <Row label="자동 분석" toggleKey="auto"/>
        <Row label="설정 충돌 알림" toggleKey="conflict"/>
        <Row label="위키 자동 생성" toggleKey="wiki"/>
        <Section title="계정"/>
        <Row label="구독 플랜" value="스탠다드"/>
        <Row label="데이터 백업" value="방금 전"/>
      </div>
    </div>
  );
};

/* ── NavBar ── */
const NavBar = ({active, onChange}) => {
  const T = useT();
  const tabs = [
    {id:'editor',   icon:<IcEdit/>,  label:'에디터'},
    {id:'brain',    icon:<IcBrain/>, label:'브레인'},
    {id:'wiki',     icon:<IcBook/>,  label:'위키'},
    {id:'settings', icon:<IcGear/>,  label:'설정'},
  ];
  return (
    <div style={{height:50,background:T.bg,borderTop:`1px solid ${T.border}`,display:'flex',alignItems:'stretch',flexShrink:0,transition:'background .4s,border-color .4s'}}>
      {tabs.map(({id, icon, label}) => {
        const on = active === id;
        return (
          <button key={id} onClick={()=>onChange(id)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:3,background:'none',border:'none',cursor:'pointer',color:on?T.brand:T.textTert,padding:0,transition:'color .2s',fontFamily:T.font,WebkitTapHighlightColor:'transparent'}}>
            {icon}
            <span style={{fontSize:10,fontWeight:on?700:400,letterSpacing:'-.01em',lineHeight:1}}>{label}</span>
          </button>
        );
      })}
    </div>
  );
};

/* ── Wiki Drawer ── */
const WikiDrawer = ({isOpen, onClose}) => {
  const T = useT();
  const [vis, setVis] = useState(false);
  const [mnt, setMnt] = useState(false);
  useEffect(() => {
    if (isOpen) {setMnt(true); requestAnimationFrame(()=>requestAnimationFrame(()=>setVis(true)));}
    else {setVis(false); const t=setTimeout(()=>setMnt(false),300); return()=>clearTimeout(t);}
  }, [isOpen]);
  if (!mnt) return null;
  return (
    <>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(26,27,30,.35)',opacity:vis?1:0,transition:'opacity .28s',zIndex:50,backdropFilter:'blur(3px)',WebkitBackdropFilter:'blur(3px)'}}/>
      <div style={{position:'absolute',top:0,right:0,bottom:0,width:'78%',background:T.bg,boxShadow:'-4px 0 24px rgba(26,27,30,.10)',zIndex:51,transform:vis?'translateX(0)':'translateX(100%)',transition:`transform .28s cubic-bezier(0,0,.2,1),background .4s`,display:'flex',flexDirection:'column'}}>
        <div style={{height:47,display:'flex',alignItems:'center',padding:'0 14px',borderBottom:`1px solid ${T.border}`,flexShrink:0,transition:'border-color .4s'}}>
          <span style={{fontFamily:T.font,fontSize:16,fontWeight:700,color:T.text,letterSpacing:'-.02em',flex:1,transition:'color .4s'}}>위키 서랍</span>
          <IBtn onClick={onClose}><IcClose/></IBtn>
        </div>
        <div style={{flex:1,overflowY:'auto',padding:'10px 12px',display:'flex',flexDirection:'column',gap:8}}>
          {WIKI.slice(0,4).map(e => (
            <div key={e.id} style={{background:T.bgSubtle,borderRadius:12,padding:'11px 13px',cursor:'pointer',transition:'background .4s'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <span style={{fontFamily:T.font,fontSize:14,fontWeight:700,color:T.text,flex:1,transition:'color .4s'}}>{e.name}</span>
                <WikiChip type={e.type}/>
              </div>
              <p style={{fontFamily:T.font,fontSize:12,color:T.textSec,margin:0,lineHeight:1.5,transition:'color .4s'}}>{e.desc}</p>
            </div>
          ))}
        </div>
      </div>
    </>
  );
};

/* ── Warning Sheet ── */
const WarningSheet = ({isOpen, onClose, onConfirm}) => {
  const T = useT();
  const [vis, setVis] = useState(false);
  const [mnt, setMnt] = useState(false);
  useEffect(() => {
    if (isOpen) {setMnt(true); requestAnimationFrame(()=>requestAnimationFrame(()=>setVis(true)));}
    else {setVis(false); const t=setTimeout(()=>setMnt(false),300); return()=>clearTimeout(t);}
  }, [isOpen]);
  if (!mnt) return null;
  return (
    <>
      <div onClick={onClose} style={{position:'absolute',inset:0,background:'rgba(26,27,30,.4)',opacity:vis?1:0,transition:'opacity .28s',zIndex:100,backdropFilter:'blur(4px)',WebkitBackdropFilter:'blur(4px)'}}/>
      <div style={{position:'absolute',bottom:0,left:0,right:0,background:T.bg,borderRadius:'18px 18px 0 0',padding:'12px 20px 36px',boxShadow:'0 8px 32px rgba(26,27,30,.14)',zIndex:101,transform:vis?'translateY(0)':'translateY(100%)',transition:`transform 200ms ease-out,background .4s`}}>
        <div style={{width:36,height:4,borderRadius:2,background:T.border,margin:'0 auto 20px',transition:'background .4s'}}/>
        <div style={{background:T.redBg,borderRadius:12,padding:'11px 14px',marginBottom:16,display:'flex',gap:9,alignItems:'flex-start',transition:'background .4s'}}>
          <div style={{width:6,height:6,borderRadius:'50%',background:T.red,marginTop:5,flexShrink:0,animation:'sm-pulse 1.5s ease-in-out infinite'}}/>
          <p style={{fontFamily:T.font,fontSize:13,color:T.red,margin:0,lineHeight:1.55,fontWeight:600}}>설정 충돌을 발견했어요</p>
        </div>
        <h3 style={{fontFamily:T.font,fontSize:18,fontWeight:700,color:T.text,margin:'0 0 8px',letterSpacing:'-.02em',transition:'color .4s'}}>이야기가 맞지 않아요</h3>
        <p style={{fontFamily:T.font,fontSize:14,color:T.textSec,margin:'0 0 24px',lineHeight:1.7,letterSpacing:'-.01em',transition:'color .4s'}}>
          박민준이 2장에서 이미 자리를 떠났는데, 여기서 다시 등장하고 있어요. 설정을 확인해볼까요?
        </p>
        <PressBtn onClick={onConfirm} style={{width:'100%',height:53,background:T.brand,color:'#fff',border:'none',borderRadius:14,fontFamily:T.font,fontSize:16,fontWeight:700,cursor:'pointer',letterSpacing:'-.01em',marginBottom:10,transition:'background .4s'}}>
          설정 확인하기
        </PressBtn>
        <PressBtn onClick={onClose} style={{width:'100%',height:44,background:T.bgSubtle,color:T.textSec,border:'none',borderRadius:14,fontFamily:T.font,fontSize:15,fontWeight:500,cursor:'pointer',letterSpacing:'-.01em',transition:'background .4s,color .4s'}}>
          그냥 둘래요
        </PressBtn>
      </div>
    </>
  );
};

/* ── App ── */
const App = () => {
  const [tw, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const theme = makeTheme(tw.accent, tw.atmosphere, tw.rhythm);

  const [tab, setTab] = useState('editor');
  const [warn, setWarn] = useState(false);
  const [drawer, setDrawer] = useState(false);
  const [shake, setShake] = useState(false);
  const [aiStatus, setAiStatus] = useState('analyzing');

  useEffect(() => {
    if (tab === 'editor') {
      setAiStatus('analyzing');
      const t1 = setTimeout(()=>setAiStatus('warning'), 3000);
      const t2 = setTimeout(()=>{setShake(true);setWarn(true);setTimeout(()=>setShake(false),400);}, 3500);
      return () => {clearTimeout(t1);clearTimeout(t2);};
    } else {
      setAiStatus('analyzing'); setWarn(false); setDrawer(false);
    }
  }, [tab]);

  return (
    <ThemeCtx.Provider value={theme}>
      {/* Full-screen backdrop — picks up atmosphere deviceBg */}
      <div style={{position:'fixed',inset:0,background:theme.deviceBg,display:'flex',alignItems:'center',justifyContent:'center',transition:'background .6s'}}>
        <div style={{width:390,height:844,background:theme.bg,borderRadius:44,overflow:'hidden',position:'relative',display:'flex',flexDirection:'column',boxShadow:'0 40px 100px rgba(0,0,0,.55),0 0 0 1.5px rgba(255,255,255,.12)',transition:'background .4s'}}>
          <StatusBar/>
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',position:'relative'}}>
            {tab==='editor'   && <EditorScreen onWikiOpen={()=>setDrawer(true)} aiStatus={aiStatus} shake={shake} isEmpty={tw.emptyState}/>}
            {tab==='brain'    && <BrainScreen/>}
            {tab==='wiki'     && <WikiScreen/>}
            {tab==='settings' && <SettingsScreen/>}
            <WikiDrawer isOpen={drawer} onClose={()=>setDrawer(false)}/>
            <WarningSheet isOpen={warn} onClose={()=>setWarn(false)} onConfirm={()=>{setWarn(false);setTab('wiki');}}/>
          </div>
          <NavBar active={tab} onChange={setTab}/>
        </div>
      </div>

      {/* Tweaks panel — floats outside the phone frame */}
      <TweaksPanel title="Tweaks">
        <TweakSection label="분위기"/>
        <TweakRadio
          label="배경 분위기"
          value={tw.atmosphere}
          options={['낮','황혼','밤']}
          onChange={v => setTweak('atmosphere', v)}
        />
        <TweakSection label="에디터 리듬"/>
        <TweakRadio
          label="글쓰기 밀도"
          value={tw.rhythm}
          options={['넓게','보통','빽빽히']}
          onChange={v => setTweak('rhythm', v)}
        />
        <TweakSection label="강조 색상"/>
        <TweakColor
          label="브랜드 색상"
          value={tw.accent}
          options={['#1F4EF5','#7C3AED','#16A34A','#D97706']}
          onChange={v => setTweak('accent', v)}
        />
        <TweakSection label="엣지 케이스"/>
        <TweakToggle
          label="빈 에디터 화면"
          value={tw.emptyState}
          onChange={v => setTweak('emptyState', v)}
        />
      </TweaksPanel>
    </ThemeCtx.Provider>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
